<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA & Theme -->
  <meta name="theme-color" content="#6C63FF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="راد" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <meta name="description" content="راد - بازی آموزشی برای دانش‌آموزان کلاس اول" />

  <title>راد - بازی آموزشی</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #6C63FF;
      direction: rtl;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #root { min-height: 100vh; min-height: 100dvh; }

    /* ── Splash Screen ─────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #6C63FF 0%, #a855f7 55%, #FF6584 100%);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    #splash.hide {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none;
    }
    .splash-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .splash-star {
      position: absolute;
      animation: starFloat linear infinite;
      opacity: 0;
    }
    @keyframes starFloat {
      0%   { transform: translateY(105vh) rotate(0deg);   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
    }
    .splash-logo {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .splash-icon {
      width: 110px;
      height: 110px;
      background: rgba(255,255,255,0.18);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.8rem;
      margin: 0 auto 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
      animation: iconPop 0.75s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes iconPop {
      from { transform: scale(0) rotate(-15deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);   opacity: 1; }
    }
    .splash-title {
      font-size: 3.4rem;
      font-weight: 900;
      color: white;
      text-shadow: 0 4px 24px rgba(0,0,0,0.2);
      animation: fadeUp 0.5s 0.25s ease both;
    }
    .splash-sub {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.82);
      margin-top: 6px;
      animation: fadeUp 0.5s 0.4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .splash-dots {
      display: flex;
      gap: 9px;
      margin-top: 44px;
      animation: fadeUp 0.5s 0.55s ease both;
    }
    .splash-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      animation: dotPulse 1.3s ease-in-out infinite;
    }
    .splash-dot:nth-child(2) { animation-delay: 0.22s; }
    .splash-dot:nth-child(3) { animation-delay: 0.44s; }
    @keyframes dotPulse {
      0%,80%,100% { transform: scale(0.75); opacity: 0.5; }
      40%         { transform: scale(1.35); opacity: 1; background: white; }
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="splash-bg" id="splashBg"></div>
    <div class="splash-logo">
      <div class="splash-icon">🌟</div>
      <div class="splash-title">راد</div>
      <div class="splash-sub">یادگیری با بازی</div>
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    const _emojis = ['⭐','🌟','✨','💫','🎮','📚','🚀','🎯','🌈','🏆','🎪','🎨']
    const _bg = document.getElementById('splashBg')
    for (let i = 0; i < 20; i++) {
      const s = document.createElement('div')
      s.className = 'splash-star'
      s.textContent = _emojis[Math.floor(Math.random() * _emojis.length)]
      s.style.left = (Math.random() * 100) + 'vw'
      s.style.animationDuration = (4 + Math.random() * 5) + 's'
      s.style.animationDelay = (Math.random() * 5) + 's'
      s.style.fontSize = (0.9 + Math.random() * 1.1) + 'rem'
      _bg.appendChild(s)
    }
    window.__hideSplash = function() {
      var el = document.getElementById('splash')
      if (el) { el.classList.add('hide'); setTimeout(function(){ el.remove() }, 650) }
    }
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
