version: '3.8'

services:

  # ── Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rad-postgres
    environment:
      POSTGRES_DB: rad
      POSTGRES_USER: rad
      POSTGRES_PASSWORD: rad_secret_2024
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rad -d rad"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - rad-net

  # ── Cache ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rad-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - rad-net

  # ── Media Storage ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: rad-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rad_admin
      MINIO_ROOT_PASSWORD: rad_minio_2024
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"   # MinIO Console (admin only)
    restart: unless-stopped
    networks:
      - rad-net

  # ── Backend ─────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: rad-backend
    volumes:
      - ./backend:/app
      - ./backend/content:/app/content
    environment:
      - DATABASE_URL=postgresql+asyncpg://rad:rad_secret_2024@postgres:5432/rad
      - REDIS_URL=redis://redis:6379/0
      - MINIO_URL=http://minio:9000
      - SECRET_KEY=rad_educational_app_secret_key_2024_very_secure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - rad-net

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rad-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rad-net

  # ── Reverse Proxy ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: rad-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - rad-net

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  rad-net:
    driver: bridge
